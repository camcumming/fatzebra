<!DOCTYPE html>
<html>
  <head>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/3.1.2/rollups/hmac-md5.js"></script>
    <link href="harness.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
      <a class="navbar-brand" href="../index.html">Fat Zebra</a>
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="../fatzebra.js/harness.html">JS SDK</a></li>
        <li class="nav-item"><a class="nav-link active" href="../v3/harness.html">V3 Hosted</a></li>
        <li class="nav-item"><a class="nav-link" href="../direct-post/harness.html">Direct Post</a></li>
      </ul>
    </nav>
    <div class="container-fluid">
      <div class="row row-margin">
        <div class="col-md-12">
          <h2 class="row-margin">Fat Zebra V3 Hosted Payment Page</h2>
        </div>
      </div>
      <div class="row">
        <div class="col-md-4">
          <form id="v3-form">

            <h4>Submission Mode</h4>
            <hr/>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="submit-mode" id="mode-newtab" value="newtab" checked>
              <label class="form-check-label" for="mode-newtab">
                <strong>New Tab</strong>
                <small class="text-muted d-block">Opens the payment page in a new browser tab.</small>
              </label>
            </div>
            <div class="form-check mt-2">
              <input class="form-check-input" type="radio" name="submit-mode" id="mode-redirect" value="redirect">
              <label class="form-check-label" for="mode-redirect">
                <strong>Redirect</strong>
                <small class="text-muted d-block">Navigates the current tab to the payment page.</small>
              </label>
            </div>
            <div class="form-check mt-2 mb-3">
              <input class="form-check-input" type="radio" name="submit-mode" id="mode-iframe" value="iframe">
              <label class="form-check-label" for="mode-iframe">
                <strong>iFrame</strong>
                <small class="text-muted d-block">Embeds the payment page in an iframe below. Adds <code>iframe=true</code> for the stripped layout and sets <code>return_target=_parent</code> so the callback breaks out of the frame.</small>
              </label>
            </div>

            <h4>Credentials</h4>
            <hr/>
            <div class="form-group">
              <label for="username">username</label>
              <input type="text" id="username" class="form-control" value="">
            </div>
            <div class="form-group">
              <label for="sharedSecret">sharedSecret</label>
              <input type="text" id="sharedSecret" class="form-control" value="">
              <small id="creds-saved-note" class="text-muted mt-1" style="display:none;">
                Credentials restored from saved cookie. <a href="#" id="clear-creds">Clear</a>
              </small>
            </div>

            <h4>Payment</h4>
            <hr/>
            <div class="form-group">
              <label for="amount">amount (decimal, e.g. 1.00)</label>
              <input type="text" id="amount" class="form-control" value="1.00">
            </div>
            <div class="form-group">
              <label for="currency">currency</label>
              <input type="text" id="currency" class="form-control" value="AUD">
            </div>
            <div class="form-group">
              <label for="reference">reference</label>
              <input type="text" id="reference" class="form-control" value="">
            </div>

            <h4>Options</h4>
            <hr/>
            <div class="form-group">
              <label for="return_path">return_path</label>
              <input type="text" id="return_path" class="form-control" placeholder="https://yoursite.com/payment/callback">
            </div>
            <div class="form-group">
              <label for="button_text">button_text</label>
              <input type="text" id="button_text" class="form-control" placeholder="Pay Now">
            </div>
            <div class="form-group">
              <label for="cards">cards</label>
              <input type="text" id="cards" class="form-control" placeholder="VISA,MASTERCARD">
            </div>
            <div class="form-group">
              <label for="logo_url">logo_url</label>
              <input type="text" id="logo_url" class="form-control" placeholder="https://...">
            </div>
            <div class="form-group">
              <label for="css">css</label>
              <input type="text" id="css" class="form-control" placeholder="https://...">
            </div>
            <div class="form-group">
              <label for="css_signature">css_signature</label>
              <input type="text" id="css_signature" class="form-control" placeholder="HMAC-MD5 of css URL">
            </div>
            <div class="form-group form-check">
              <input type="checkbox" class="form-check-input" id="tokenize_only">
              <label class="form-check-label" for="tokenize_only">tokenize_only</label>
            </div>
            <div class="form-group form-check">
              <input type="checkbox" class="form-check-input" id="auth">
              <label class="form-check-label" for="auth">auth</label>
            </div>
            <div class="form-group form-check">
              <input type="checkbox" class="form-check-input" id="show_email">
              <label class="form-check-label" for="show_email">show_email</label>
            </div>
            <div class="form-group form-check">
              <input type="checkbox" class="form-check-input" id="show_extras">
              <label class="form-check-label" for="show_extras">show_extras</label>
            </div>
            <div class="form-group form-check">
              <input type="checkbox" class="form-check-input" id="hide_card_holder">
              <label class="form-check-label" for="hide_card_holder">hide_card_holder</label>
            </div>
            <div class="form-group form-check">
              <input type="checkbox" class="form-check-input" id="hide_button">
              <label class="form-check-label" for="hide_button">hide_button</label>
            </div>
            <div class="form-group form-check">
              <input type="checkbox" class="form-check-input" id="surcharge">
              <label class="form-check-label" for="surcharge">surcharge</label>
            </div>
            <div class="form-group form-check">
              <input type="checkbox" class="form-check-input" id="postmessage">
              <label class="form-check-label" for="postmessage">postmessage</label>
            </div>
          </form>
        </div>

        <div class="col-md-8">
          <h4 class="row-margin">Generated URL</h4>
          <div class="row row-margin button-controls">
            <div class="col-md-12">
              <button type="button" class="btn btn-outline-primary" id="generate">Generate URL</button>
              <button type="button" class="btn btn-success" id="action-btn" disabled>Open in New Tab</button>
              <button type="button" class="btn btn-outline-secondary" data-toggle="modal" data-target="#test-card-modal">View Test Cards</button>
            </div>
          </div>
          <div class="row row-margin">
            <div class="col-md-12">
              <div id="url-display" class="mt-3" style="display:none;">
                <label>URL</label>
                <div class="input-group">
                  <input type="text" id="generated-url" class="form-control" readonly>
                  <div class="input-group-append">
                    <button class="btn btn-outline-secondary" id="copy-url" type="button">Copy</button>
                  </div>
                </div>
                <small class="text-muted mt-1 d-block">Hash input: <code id="hash-input-display"></code></small>
              </div>
              <div id="url-error" class="alert alert-danger mt-3" style="display:none;"></div>
            </div>
          </div>
          <div id="iframe-container" class="row row-margin" style="display:none;">
            <div class="col-md-12">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <h4 class="mb-0">iFrame Preview</h4>
                <button type="button" class="btn btn-sm btn-outline-danger" id="clear-iframe">Clear</button>
              </div>
              <iframe id="fz-iframe" src="" frameborder="0" style="width:100%; height:600px; border:1px solid #dee2e6; border-radius:4px;"></iframe>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="test-card-modal" data-backdrop="static" data-keyboard="false" tabindex="-1" aria-labelledby="testCardModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="testCardModalLabel">Test Cards</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <table class="table">
              <thead>
                <tr>
                  <th scope="col">Group</th>
                  <th scope="col">Card Number</th>
                  <th scope="col">Description</th>
                </tr>
              </thead>
              <tbody id="card-list"></tbody>
            </table>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>
  </body>
  <footer>
    <script src="harness.js?v=2"></script>
  </footer>
</html>
